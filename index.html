<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人狼ゲーム・接続テスト</title>
  <style>
    body {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #222;
    }
    input, button {
      font: inherit;
      padding: 8px 12px;
      margin: 4px 4px 4px 0;
    }
    #status {
      padding: 10px 12px;
      background: #f2f4f7;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
    #phase {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .note {
      color: #555;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <h1>人狼ゲーム・接続テスト</h1>

  <label for="roomId">部屋番号：</label>
  <input id="roomId" value="test-room" autocomplete="off">
  <button id="joinButton" type="button">部屋に接続</button>

  <p id="status" role="status" aria-live="polite">JavaScriptを読み込んでいます...</p>

  <h2>現在のフェーズ</h2>
  <p id="phase">未接続</p>

  <button id="dayButton" type="button">昼にする</button>
  <button id="nightButton" type="button">夜にする</button>

  <p class="note">
    テスト用の画面です。同じ部屋番号で複数のブラウザから接続すると、フェーズの変更が共有されます。
  </p>

  <script type="module" src="./game.js"></script>
</body>
</html>
